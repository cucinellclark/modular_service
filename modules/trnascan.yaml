schema: modpipe/module/v1
id: trnascan
version: 1
label: "tRNAscan-SE: tRNA gene detection"
description: Finds tRNA genes using covariance models (bacterial, archaeal or general eukaryotic mode).
category: annotation
tool: {id: trnascan, binary: tRNAscan-SE, version: 2.0.9}
inputs:
  - {id: contigs, type: sequences.dna, requires: {compression: none}}
outputs:
  - {id: trnas, type: annotation.trna, path: trna.txt}
  - {id: gff, type: annotation.gff, path: trna.gff}
  - {id: structures, type: report.text, path: trna.ss}
  - {id: stats, type: report.text, path: trna_stats.txt}
parameters:
  - {id: mode, type: enum, enum: [bacterial, archaeal, general], default: bacterial, label: "Search mode"}
resources: {cpu: 4, memory: 4G, runtime: 4h}
command: |
  tRNAscan-SE {{ {'bacterial': '-B', 'archaeal': '-A', 'general': '-G'}[params.mode] }} --thread {{ cpu }}
  -o {{ outputs.trnas }} -f {{ outputs.structures }} -m {{ outputs.stats }} --gff {{ outputs.gff }} {{ inputs.contigs | q }}
tests:
  discovery_runs: [trnascan_bacterial]
provenance: {nfcore: [trnascanse]}
