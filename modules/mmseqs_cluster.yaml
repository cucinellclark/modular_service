schema: modpipe/module/v1
id: mmseqs_cluster
version: 1
label: "MMseqs2: cluster sequences"
description: easy-cluster; writes representative sequences and a representative->member table.
category: homology
tool: {id: mmseqs, binary: mmseqs, version: "13-45111"}
inputs:
  - {id: sequences, type: sequences}
outputs:
  - id: clusters
    type: homology.clusters
    parts: {representatives: clu_rep_seq.fasta, membership: clu_cluster.tsv}
parameters:
  - {id: min_seq_id, type: float, default: 0.5, min: 0, max: 1, label: "Minimum sequence identity"}
  - {id: coverage, type: float, default: 0.8, min: 0, max: 1, label: "Minimum alignment coverage (-c)"}
resources: {cpu: 8, memory: 16G, runtime: 6h}
command: |
  mmseqs easy-cluster {{ inputs.sequences | q }} clu "$TMPDIR/mmseqs" --threads {{ cpu }}
  --min-seq-id {{ params.min_seq_id }} -c {{ params.coverage }}
tests:
  discovery_runs: [mmseqs_easy_cluster]
provenance: {nfcore: [mmseqs/easycluster]}
