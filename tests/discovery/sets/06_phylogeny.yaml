# P4 discovery set: multiple alignment, trimming, trees, multi-genome comparison.
set: phylogeny
resources: {cpus: 4, mem: 16G, time: "02:00:00"}
runs:
  - id: mafft_auto_dna
    tool: mafft
    mode: auto_dna
    inputs: {A: sarscov2_aln_all_sites}
    prep: sed '/^>/!s/-//g' $A > unaligned.fna
    cmd: mafft --auto --thread $CPU unaligned.fna > aligned.fasta
  - id: mafft_linsi_protein
    tool: mafft
    mode: linsi_protein
    inputs: {P: sarscov2_proteome}
    cmd: mafft --localpair --maxiterate 1000 --thread $CPU $P > aligned.fasta
  - id: muscle
    tool: muscle
    mode: v3_default
    inputs: {A: sarscov2_aln_all_sites}
    prep: sed '/^>/!s/-//g' $A > unaligned.fna
    cmd: muscle -in unaligned.fna -out aligned.fasta
  - id: clustalw
    tool: clustalw
    mode: fasta_output
    inputs: {A: sarscov2_aln_all_sites}
    prep: sed '/^>/!s/-//g' $A > unaligned.fna
    cmd: clustalw -INFILE=unaligned.fna -OUTFILE=aligned.fasta -OUTPUT=FASTA
  - id: progressivemauve
    tool: progressivemauve
    mode: genomes
    inputs: {G1: bvbrc_1206109.14, G2: bvbrc_1239881.13, G3: bvbrc_1297582.10}
    cmd: progressiveMauve --output=aln.xmfa --output-guide-tree=guide.tree --backbone-output=aln.backbone $G1 $G2 $G3
  - id: gblocks_dna
    tool: gblocks
    mode: dna
    description: Gblocks exits non-zero even on success; check outputs
    inputs: {A: sarscov2_aln_all_sites}
    prep: cp $A aln.fas
    cmd: Gblocks aln.fas -t=d -b5=h || test -s aln.fas-gb
  - id: fasttree_nt
    tool: fasttree
    mode: nt_gtr
    inputs: {A: sarscov2_aln_all_sites}
    description: matches modules/fasttree.yaml (FastTree 2.1.11 with -log)
    cmd: FastTree -nt -gtr -log fasttree.log $A > tree.nwk
  - id: fasttree_aa
    tool: fasttree
    mode: aa_lg
    inputs: {P: sarscov2_proteome}
    description: uses FastTree 2.1.11; FastTreeMP on PATH is 2.1.3, which has no -lg
    prep: mafft --auto --quiet $P > aln.faa
    cmd: FastTree -lg -log fasttree.log aln.faa > tree.nwk
  - id: raxmlhpc
    tool: raxmlhpc
    mode: gtrgamma_search
    inputs: {A: sarscov2_aln_all_sites}
    cmd: raxmlHPC-PTHREADS-SSE3 -T $CPU -m GTRGAMMA -p 12345 -s $A -n run -w $PWD
  - id: raxml_ng
    tool: raxml-ng
    mode: search1
    inputs: {A: sarscov2_aln_all_sites}
    cmd: raxml-ng --search1 --msa $A --model GTR+G --threads $CPU --prefix rng --seed 2
  - id: iqtree2_fast
    tool: iqtree2
    mode: fast_gtr
    inputs: {A: sarscov2_aln_all_sites}
    cmd: iqtree2 -s $A -m GTR+G -T $CPU --fast --prefix iq
  - id: iqtree2_mfp_ufboot
    tool: iqtree2
    mode: modelfinder+ufboot
    inputs: {A: portiera_aln}
    prep: gunzip -c $A > aln.fas
    cmd: iqtree2 -s aln.fas -m MFP -B 1000 -T $CPU --prefix iq
  - id: parsnp_core
    tool: parsnp
    mode: curated_genomes
    inputs: {G1: bvbrc_1206109.14, G2: bvbrc_1239881.13, G3: bvbrc_1297582.10, G4: bvbrc_91844.21}
    prep: mkdir genomes && cp $G2 $G3 $G4 genomes/
    cmd: parsnp -r $G1 -d genomes -o out -p $CPU -c
  - id: ksnp4
    tool: ksnp4
    mode: core+ML
    inputs: {G1: bvbrc_1206109.14, G2: bvbrc_1239881.13, G3: bvbrc_1297582.10, G4: bvbrc_91844.21}
    description: kSNP rejects file names with extra dots, so genomes are copied to g<id>.fasta
    prep: |
      mkdir genomes
      for g in $G1 $G2 $G3 $G4; do n=g$(basename $g .fna | tr . _); cp $g genomes/$n.fasta; printf '%s\t%s\n' "$PWD/genomes/$n.fasta" "$n"; done > in_list.txt
    cmd: kSNP4 -k 19 -outdir out -in in_list.txt -core -ML -CPU $CPU
